apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-metrics
  namespace: praxis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis
      app.kubernetes.io/component: data-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9902
