apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: praxis
  labels:
    app.kubernetes.io/name: praxis
    app.kubernetes.io/component: data-plane
data:
  config.yaml: |
    admin:
      metrics_address: "0.0.0.0:9902"
    listeners:
      - name: http
        address: "0.0.0.0:8080"
        filter_chains:
          - main
      - name: https
        address: "0.0.0.0:8443"
        filter_chains:
          - main
        tls:
          certificates:
            - cert_path: /etc/praxis/tls/tls.crt
              key_path: /etc/praxis/tls/tls.key
    filter_chains:
      - name: main
        filters:
          - filter: request_id
          - filter: static_response
            conditions:
              - when:
                  path_prefix: /config-version
            status: 200
            body: config-v1
          - filter: router
            routes:
              - path_prefix: /healthy
                cluster: healthy-backend
              - path_prefix: /
                cluster: backend
          - filter: load_balancer
            clusters:
              - name: backend
                endpoints:
                  - backend:8080
                trusted_private_endpoints:
                  - backend
              - name: healthy-backend
                endpoints:
                  - healthy-backend:8080
                trusted_private_endpoints:
                  - healthy-backend
    runtime:
      threads: 1
