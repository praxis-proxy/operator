apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: praxis
  labels:
    app.kubernetes.io/name: praxis
    app.kubernetes.io/component: data-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: praxis
    app.kubernetes.io/component: data-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
