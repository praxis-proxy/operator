apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: praxis
  labels:
    app.kubernetes.io/name: praxis
    app.kubernetes.io/component: data-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis
      app.kubernetes.io/component: data-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis
        app.kubernetes.io/component: data-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: praxis
              app.kubernetes.io/component: data-plane
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: praxis
              app.kubernetes.io/component: data-plane
      containers:
        - name: praxis
          image: praxis
          command:
            - praxis
          args:
            - -c
            - /etc/praxis/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9902
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthy
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthy
              port: metrics
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: tls
              mountPath: /etc/praxis/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: praxis-config
        - name: tls
          secret:
            secretName: praxis-tls
        - name: tmp
          emptyDir: {}
