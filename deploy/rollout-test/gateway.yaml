apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rollout
  namespace: praxis
  annotations:
    praxis.sh/replicas: "2"
spec:
  gatewayClassName: praxis
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: praxis-tls
      allowedRoutes:
        namespaces:
          from: All
