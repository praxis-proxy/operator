apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: praxis
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: busybox:1.37.0
          args: [httpd, -f, -p, "8080", -h, /www]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          configMap:
            name: backend-content
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-content
  namespace: praxis
data:
  healthy: ok
  index.html: ok
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: praxis
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-backend
  namespace: praxis
  labels:
    app.kubernetes.io/name: healthy-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: healthy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthy-backend
    spec:
      containers:
        - name: backend
          image: busybox:1.37.0
          args: [httpd, -f, -p, "8080", -h, /www]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          configMap:
            name: backend-content
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-backend
  namespace: praxis
spec:
  selector:
    app.kubernetes.io/name: healthy-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
