apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollout
  namespace: praxis
spec:
  parentRefs:
    - name: rollout
  rules:
    - matches:
        - path:
            type: Exact
            value: /config-version
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /config-v1
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /healthy
      backendRefs:
        - name: healthy-backend
          port: 8080
    - backendRefs:
        - name: backend
          port: 8080
