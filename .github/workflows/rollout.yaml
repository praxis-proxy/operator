name: Rollout

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rollout.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Containerfile"
      - "Containerfile.*"
      - "src/**"
      - "deploy/**"

concurrency:
  group: rollout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CONTAINER_ENGINE: docker

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out praxis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: praxis-proxy/praxis
          path: praxis
          ref: f5a79aa36bebbaf542ce109c81144354926f52a9
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f671c1215f89562d286310a6cabdcbaa5da9605c # v0.4.0

      - name: Install KIND
        run: |
          curl --fail --location --show-error --silent \
            --output ./kind-linux-amd64.sha256sum \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64.sha256sum
          curl --fail --location --show-error --silent \
            --output ./kind-linux-amd64 \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          sha256sum --check ./kind-linux-amd64.sha256sum
          chmod +x ./kind-linux-amd64
          sudo mv ./kind-linux-amd64 /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl --fail --location --show-error --silent \
            --output ./kubectl.sha256 \
            "https://dl.k8s.io/release/v1.33.3/bin/linux/amd64/kubectl.sha256"
          curl --fail --location --show-error --silent \
            --output ./kubectl \
            "https://dl.k8s.io/release/v1.33.3/bin/linux/amd64/kubectl"
          echo "$(cat ./kubectl.sha256)  kubectl" | sha256sum --check --strict -
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Run rollout suite (source image)
        working-directory: praxis
        run: >-
          cargo xtask rollout
          --manifest-dir ../deploy/rollout-test
          --operator-dir ..
          --keep-cluster

      - name: Pull the deployed default Praxis image
        id: published
        run: |
          published_praxis_image=$(sed -n 's/^const DEFAULT_PRAXIS_IMAGE: &str = "\(.*\)";$/\1/p' src/context.rs)
          test -n "$published_praxis_image"
          docker pull "$published_praxis_image"
          echo "image=$published_praxis_image" >> "$GITHUB_OUTPUT"

      - name: Start the published-image case with a fresh cluster
        run: kind delete cluster --name praxis-rollout

      - name: Run rollout suite (published default image)
        working-directory: praxis
        env:
          PRAXIS_RELEASE_IMAGE: ${{ steps.published.outputs.image }}
        run: >-
          cargo xtask rollout
          --manifest-dir ../deploy/rollout-test
          --operator-dir ..
          --image "$PRAXIS_RELEASE_IMAGE"
          --operator-image localhost/praxis-operator:rollout
          --skip-build
          --keep-cluster

      - name: Dump cluster state
        if: failure()
        run: |
          kubectl --request-timeout=30s --context kind-praxis-rollout -n praxis get pods -o wide || true
          kubectl --request-timeout=30s --context kind-praxis-rollout get nodes -o wide || true
          kubectl --request-timeout=30s --context kind-praxis-rollout get events -A --sort-by=.lastTimestamp || true
          kubectl --request-timeout=30s --context kind-praxis-rollout get crd gatewayclasses.gateway.networking.k8s.io gateways.gateway.networking.k8s.io httproutes.gateway.networking.k8s.io || true

      - name: Delete test cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name praxis-rollout
          fi
