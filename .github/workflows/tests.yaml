name: Tests (Unit)

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose test output (V=1)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  V: ${{ inputs.debug && '1' || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint (fmt + clippy + rustdoc)
  # ---------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0

      # `make lint` runs `cargo machete`; the setup action only provides
      # clippy and rustfmt, so install machete before linting.
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint
        run: make lint

      - name: Documentation
        run: make doc

  # ---------------------------------------------------------------------------
  # Build + test
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0

      - name: Build
        run: make build

      - name: Tests
        run: make test

  # ---------------------------------------------------------------------------
  # Coverage floor
  # ---------------------------------------------------------------------------

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check coverage
        uses: praxis-proxy/conventions/.github/actions/coverage-check@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0

  # ---------------------------------------------------------------------------
  # Supply-chain audit
  # ---------------------------------------------------------------------------

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/supply-chain-audit@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
